<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tiles Demo | Three Story Controls</title>
  <link rel="stylesheet" href="../shared-styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "gsap": "https://unpkg.com/gsap@3.15.0/index.js",
      "3d-tiles-renderer": "https://esm.sh/3d-tiles-renderer@0.4.28/three?external=three",
      "three-story-controls": "../../../dist/three-story-controls.esm.js"
    }
  }
  </script>
</head>
<body class="demo-page">
  <div class="canvas-parent"></div>

  <a href="../index.html" class="back-link">Back to Demos</a>

  <div class="info-panel">
    <h2>3D Tiles + FreeMovement Controls</h2>
    <p>NASA-AMMOS 3DTilesRendererJS streams a remote 3D Tiles set while Three Story Controls handles navigation.</p>
    <div class="controls">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> - Move</p>
      <p><kbd>U</kbd> / <kbd>N</kbd> - Raise / Lower camera</p>
      <p><kbd>Mouse drag</kbd> - Rotate camera</p>
      <p><kbd>Scroll</kbd> - Dolly camera</p>
    </div>
  </div>

  <a class="source-btn" target="_blank" href="https://github.com/kagawa0710/three-story-controls/tree/dev/examples/demos/3d-tiles" title="View source code">

  </a>

  <script type="module" src="script.js"></script>
</body>
</html>
