<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Point Controls | Three Story Controls</title>
  <link rel="stylesheet" href="../shared-styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "gsap": "https://unpkg.com/gsap@3.15.0/index.js",
      "three-story-controls": "../../../dist/three-story-controls.esm.js"
    }
  }
  </script>
  <style>
    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      z-index: 100;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .nav-btn.prev { left: 20px; }
    .nav-btn.next { right: 20px; }

    .caption-container {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    .caption-container p {
      padding: 16px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      max-width: 400px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .caption-container { display: none; }
      .nav-btn { padding: 12px 16px; }
    }
  </style>
</head>
<body class="demo-page">
  <div class="canvas-parent"></div>

  <a href="../index.html" class="back-link">Back to Demos</a>

  <div class="info-panel">
    <h2>StoryPoint Controls</h2>
    <p>Transition between specific points in the scene with smooth camera movements.</p>
    <div class="controls">
      <p><kbd>PREV</kbd> / <kbd>NEXT</kbd> buttons to navigate</p>
      <p>Controls cycle back to start after last point</p>
    </div>
  </div>

  <button class="nav-btn prev">PREV</button>
  <button class="nav-btn next">NEXT</button>

  <div class="caption-container">
    <p></p>
  </div>

  <a class="source-btn" target="_blank" href="https://github.com/kagawa0710/three-story-controls/tree/dev/examples/demos/story-points" title="View source code">
    <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
  </a>

  <script type="module" src="script.js"></script>
</body>
</html>
