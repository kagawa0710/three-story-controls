  <link rel="stylesheet" href="../shared-styles.css">
  <script type="importmap">

<body class="demo-page">

  <div class="info-panel">
    <h2>PathPoint Controls</h2>
    <p>Transition between specific frames of a pre-defined camera animation path.</p>
    <div class="controls">
      <p><kbd>Scroll</kbd> or <kbd>Swipe</kbd> - Navigate between points</p>
      <p><kbd>Arrow keys</kbd> - Alternative navigation</p>
