<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Helper</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1e;
    }
    .canvas-parent {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="canvas-parent"></div>

  <script type="module">
    import {
      Scene,
      PerspectiveCamera,
      WebGLRenderer,
      GridHelper,
      ConeGeometry,
      MeshPhongMaterial,
      Mesh,
      Vector3,
      HemisphereLight,
    } from 'three';
    import { CameraRig, FreeMovementControls, CameraHelper } from '@kagawa0710/three-story-controls';

    const canvasParent = document.querySelector('.canvas-parent');

    const scene = new Scene();
    const camera = new PerspectiveCamera(60, canvasParent.clientWidth / canvasParent.clientHeight, 0.1, 10000);
    const renderer = new WebGLRenderer({ antialias: true });
    renderer.setSize(canvasParent.clientWidth, canvasParent.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    canvasParent.appendChild(renderer.domElement);

    const light = new HemisphereLight(0xffffbb, 0x080820, 1);
    scene.add(light);

    const grid = new GridHelper(100, 50);
    grid.position.set(0, -5, 0);
    scene.add(grid);

    const rig = new CameraRig(camera, scene);
    const controls = new FreeMovementControls(rig, {
      domElement: canvasParent,
    });
    controls.enable();

    const cameraHelper = new CameraHelper(rig, controls, renderer.domElement);

    const cones = [
      { position: new Vector3(0, 0, -30), color: 0xff0000 },
      { position: new Vector3(20, 0, -45), color: 0xffff00 },
      { position: new Vector3(45, 0, 0), color: 0xff00ff },
      { position: new Vector3(30, 0, 20), color: 0x00ffff },
      { position: new Vector3(-10, 0, 45), color: 0x00ff00 },
      { position: new Vector3(-40, 0, 20), color: 0x0000ff },
    ];

    const coneGeo = new ConeGeometry(3, 10, 4);
    cones.forEach((item) => {
      const mesh = new Mesh(coneGeo, new MeshPhongMaterial({ color: item.color }));
      mesh.position.copy(item.position);
      scene.add(mesh);
    });

    function render(t) {
      controls.update(t);
      renderer.render(scene, camera);
      cameraHelper.update(t);
      window.requestAnimationFrame(render);
    }

    window.addEventListener('resize', () => {
      camera.aspect = canvasParent.clientWidth / canvasParent.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvasParent.clientWidth, canvasParent.clientHeight);
    });

    render();
  </script>
</body>
</html>
